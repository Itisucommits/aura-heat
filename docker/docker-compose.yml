version: '3.8'

services:
  # Spatial Database: PostgreSQL 16 with PostGIS 3.4
  db:
    image: postgis/postgis:16-3.4
    container_name: aura_heat_postgis
    restart: always
    environment:
      POSTGRES_USER: aura_user
      POSTGRES_PASSWORD: aura_secret_password
      POSTGRES_DB: aura_heat_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_user -d aura_heat_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Broker & Cache: Redis 7
  redis:
    image: redis:7-alpine
    container_name: aura_heat_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI REST API Backend
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: aura_heat_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://aura_user:aura_secret_password@db:5432/aura_heat_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Asynchronous Worker (Alerts & NWP ingestion)
  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    container_name: aura_heat_celery_worker
    restart: always
    command: celery -A backend.celery_app worker --loglevel=info -c 4
    environment:
      - DATABASE_URL=postgresql+asyncpg://aura_user:aura_secret_password@db:5432/aura_heat_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  # Celery Beat Periodic Scheduler (6-hour cron ingestion)
  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    container_name: aura_heat_celery_beat
    restart: always
    command: celery -A backend.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # Web Frontend Dashboard: React + TypeScript
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: aura_heat_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgis_data:
  redis_data:
